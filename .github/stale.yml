# probot-stale 的配置 - https://github.com/probot/stale

issues:
  # Issue 或 Pull Request 连续无活动多少天后变为 stale（陈旧）状态
  daysUntilStale: 7 

  # 已带有 stale 标签的 Issue 或 Pull Request 再连续无活动多少天后被关闭。
  # 设为 false 可禁用。禁用后 Issue 仍需手动关闭，但会一直保持 stale 标记。
  daysUntilClose: 7

  # 只有同时带有以下全部标签的 Issue 或 Pull Request 才会被检查是否 stale。默认值为 `[]`（禁用此筛选）
  onlyLabels:
    - question
    - autoclose

  # 带有以下任一标签的 Issue 或 Pull Request 永远不会被视为 stale。设为 `[]` 可禁用此项
  exemptLabels:
    - p0
    - bug

  # 标记为 stale 时发布的评论。设为 `false` 可禁用
  markComment: >
    This issue has been automatically marked as stale because it has not had
    recent activity. It will be closed if no further activity occurs. Thank you
    for your contributions.
